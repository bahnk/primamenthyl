[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bam-processing"
version = "0.1.0"
description = "Extract feature tables from a single indexed BAM file."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb",
  "jax==0.5.0",
  "numpy",
  "pyarrow",
  "pysam",
  "rich-click",
]

[project.optional-dependencies]
dev = [
  "black",
  "pylint",
  "pytest",
]
macos = [
  "jax-metal==0.1.1",
]

[project.scripts]
bam-processing = "bam_processing.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["bam_processing"]

[tool.pytest.ini_options]
testpaths = ["bam_processing/extract/tests"]
