version: 2

sources:
  - name: quant
    description: Raw feature tables extracted from BAM input into DuckDB.
    database: "{{ env_var('DBT_DUCKDB_DATABASE') }}"
    schema: main
    tables:
      - name: quant__records
        description: One row per retained BAM record.
      - name: quant__methylation
        description: One row per methylation event identified on a record.
      - name: quant__motifs
        description: Motif counts aggregated from retained BAM records.
      - name: quant__samples
        description: Sample-level metadata for the DuckDB file.
models:
  - name: methylation_position_distribution
    description: Distribution of methylation event counts by 100000 bp genomic bins and sample from merged quant__methylation and quant__records sources.
    columns:
      - name: sample
        tests:
          - not_null
      - name: reference
        tests:
          - not_null
      - name: position_bin
        tests:
          - not_null
      - name: methylation_count
        tests:
          - not_null
  - name: end_motif_distribution
    description: End motif counts from the merged quant__motifs source, grouped by sample and side.
    columns:
      - name: sample
        tests:
          - not_null
      - name: side
        tests:
          - not_null
      - name: motif
        tests:
          - not_null
      - name: motif_count
        tests:
          - not_null
  - name: end_position_distribution
    description: Distribution of record end_position values by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: end_position
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: fragment_length_distribution
    description: Distribution of absolute fragment lengths by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: fragment_length
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: start_position_distribution
    description: Distribution of record start_position values by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: start_position
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: stg_fragment_pairing
    description: Counts align_ids per fragment_id and flags whether the fragment is paired.
    columns:
      - name: fragment_id
        tests:
          - not_null
          - unique
      - name: align_id_count
        tests:
          - not_null
      - name: paired
        tests:
          - not_null
  - name: stg_motif_half_counts
    description: Motif counts divided by 2 and rounded to the nearest integer.
    columns:
      - name: motif
        tests:
          - not_null
      - name: side
        tests:
          - not_null
      - name: count
        tests:
          - not_null
  - name: stg_methylation_positions
    description: Resolves methylation offsets to genomic positions by joining quant__methylation to quant__records on align_id.
    columns:
      - name: align_id
        tests:
          - not_null
      - name: reference
        tests:
          - not_null
      - name: methylation_offset
        tests:
          - not_null
      - name: position
        tests:
          - not_null
  - name: stg_record_fragments
    description: Maps each record align_id to a fragment_id shared by records with the same start_position and end_position.
    columns:
      - name: align_id
        tests:
          - not_null
          - unique
      - name: fragment_id
        tests:
          - not_null
      - name: start_position
        tests:
          - not_null
      - name: end_position
        tests:
          - not_null
      - name: template_length
        tests:
          - not_null
  - name: stg_record_methylation_counts
    description: Per-record methylation event counts derived from the raw quant tables.
    columns:
      - name: read_id
        tests:
          - not_null
          - unique
      - name: methylation_count
        tests:
          - not_null
  - name: sample_mean_methylation
    description: Mean methylation count per record for the sample represented in the DuckDB file.
    columns:
      - name: sample
        tests:
          - not_null
      - name: mean_methylation_count
        tests:
          - not_null
