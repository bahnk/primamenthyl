version: 2

sources:
  - name: quant
    description: Raw feature tables extracted from BAM input into DuckDB.
    database: "{{ env_var('DBT_DUCKDB_DATABASE') }}"
    schema: main
    tables:
      - name: quant__records
        description: One row per retained BAM record.
      - name: quant__cpg_methylated
        description: One row per CpG methylated event identified on a record.
      - name: quant__cpg_unmethylated
        description: One row per CpG unmethylated event identified on a record.
      - name: quant__chg_methylated
        description: One row per CHG methylated event identified on a record.
      - name: quant__chg_unmethylated
        description: One row per CHG unmethylated event identified on a record.
      - name: quant__chh_methylated
        description: One row per CHH methylated event identified on a record.
      - name: quant__chh_unmethylated
        description: One row per CHH unmethylated event identified on a record.
      - name: quant__motif_counts
        description: Motif counts aggregated from retained BAM records.
      - name: quant__samples
        description: Sample-level metadata for the DuckDB file.
models:
  - name: methylation_position_distribution
    description: Distribution of methylation event counts by 100000 bp genomic bins, sample, context, and methylation state from merged methylation-event and quant__records sources.
    columns:
      - name: sample
        tests:
          - not_null
      - name: reference
        tests:
          - not_null
      - name: position_bin
        tests:
          - not_null
      - name: context
        tests:
          - not_null
      - name: methylated
        tests:
          - not_null
      - name: methylation_count
        tests:
          - not_null
  - name: stg_methylation_events
    description: Unified methylation event stream across CpG, CHG, and CHH contexts, with explicit methylation state.
    columns:
      - name: align_id
        tests:
          - not_null
      - name: methylation_offset
        tests:
          - not_null
      - name: context
        tests:
          - not_null
      - name: methylated
        tests:
          - not_null
  - name: end_motif_distribution
    description: End motif counts from the merged quant__motif_counts source, grouped by sample and side.
    columns:
      - name: sample
        tests:
          - not_null
      - name: side
        tests:
          - not_null
      - name: motif
        tests:
          - not_null
      - name: motif_count
        tests:
          - not_null
  - name: end_position_distribution
    description: Distribution of record end_position values by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: end_position
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: cpg_methylation_rate_bins
    description: Per-sample CpG methylation rate for chromosome 21 bins that contain CpG observations.
    columns:
      - name: sample
        tests:
          - not_null
      - name: bin
        tests:
          - not_null
      - name: cpg_methylation_rate
  - name: chg_methylation_rate_bins
    description: Per-sample CHG methylation rate for chromosome 21 bins that contain CHG observations.
    columns:
      - name: sample
        tests:
          - not_null
      - name: bin
        tests:
          - not_null
      - name: chg_methylation_rate
  - name: chh_methylation_rate_bins
    description: Per-sample CHH methylation rate for chromosome 21 bins that contain CHH observations.
    columns:
      - name: sample
        tests:
          - not_null
      - name: bin
        tests:
          - not_null
      - name: chh_methylation_rate
  - name: fragment_length_distribution
    description: Distribution of absolute fragment lengths by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: fragment_length
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: fragment_length_stats
    description: Per-sample mean and median fragment length computed from deduplicated query fragments.
    columns:
      - name: sample
        tests:
          - not_null
      - name: mean_fragment_length
        tests:
          - not_null
      - name: median_fragment_length
        tests:
          - not_null
  - name: fragment_count_bins
    description: Per-sample fragment counts by fixed 100000 bp chromosome 21 bins using fragment midpoints from stg_query_fragments.
    columns:
      - name: sample
        tests:
          - not_null
      - name: bin
        tests:
          - not_null
      - name: fragment_count
        tests:
          - not_null
  - name: fragment_fraction_bins
    description: Per-sample fragment fractions by fixed 100000 bp chromosome 21 bins using fragment midpoints from stg_query_fragments.
    columns:
      - name: sample
        tests:
          - not_null
      - name: bin
        tests:
          - not_null
      - name: fragment_fraction
        tests:
          - not_null
  - name: global_cpg_methylation_rate
    description: Per-sample global CpG methylation rate computed as methylated event count divided by total CpG event count.
    columns:
      - name: sample
        tests:
          - not_null
      - name: global_cpg_methylation_rate
  - name: global_chg_methylation_rate
    description: Per-sample global CHG methylation rate computed as methylated event count divided by total CHG event count.
    columns:
      - name: sample
        tests:
          - not_null
      - name: global_chg_methylation_rate
  - name: global_chh_methylation_rate
    description: Per-sample global CHH methylation rate computed as methylated event count divided by total CHH event count.
    columns:
      - name: sample
        tests:
          - not_null
      - name: global_chh_methylation_rate
  - name: start_position_distribution
    description: Distribution of record start_position values by sample from the merged quant__records source.
    columns:
      - name: sample
        tests:
          - not_null
      - name: start_position
        tests:
          - not_null
      - name: record_count
        tests:
          - not_null
  - name: stg_methylation_positions
    description: Resolves methylation offsets to genomic positions by joining unified methylation events to quant__records on align_id.
    columns:
      - name: align_id
        tests:
          - not_null
      - name: reference
        tests:
          - not_null
      - name: context
        tests:
          - not_null
      - name: methylated
        tests:
          - not_null
      - name: methylation_offset
        tests:
          - not_null
      - name: position
        tests:
          - not_null
  - name: stg_methylation_edge_distances
    description: Per-methylation-event signed distance to the nearest fragment edge, negative to the left edge and positive to the right edge.
    columns:
      - name: sample
        tests:
          - not_null
      - name: query_id
        tests:
          - not_null
      - name: align_id
        tests:
          - not_null
      - name: reference
        tests:
          - not_null
      - name: context
        tests:
          - not_null
      - name: methylated
        tests:
          - not_null
      - name: methylation_offset
        tests:
          - not_null
      - name: position
        tests:
          - not_null
      - name: start_position
        tests:
          - not_null
      - name: end_position
        tests:
          - not_null
      - name: edge_distance
        tests:
          - not_null
  - name: stg_record_methylation_counts
    description: Per-record methylation event counts derived from the raw quant tables.
    columns:
      - name: read_id
        tests:
          - not_null
          - unique
      - name: methylation_count
        tests:
          - not_null
  - name: stg_query_fragments
    description: One row per query_id fragment with deduplicated start and end positions from quant__records.
    columns:
      - name: query_id
        tests:
          - not_null
          - unique
      - name: start_position
        tests:
          - not_null
      - name: end_position
        tests:
          - not_null
  - name: sample_mean_methylation
    description: Mean methylation count per record for the sample represented in the DuckDB file.
    columns:
      - name: sample
        tests:
          - not_null
      - name: mean_methylation_count
        tests:
          - not_null
